epochs: 100
lr: 1e-3
weight_decay: 1e-4
optimizer: adamw
scheduler: cosine

# Gradient accumulation
gradient_accumulation_steps: 1
max_grad_norm: 1.0

# Mixed precision
use_amp: true

# Checkpointing
save_every_n_epochs: 5
save_best: true
monitor_metric: val_loss
monitor_mode: min  # min or max

# Early stopping
early_stopping:
  enabled: true
  patience: 10
  min_delta: 1e-4

# Distributed training
distributed:
  enabled: false
  backend: nccl
